<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management MVP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: #032147;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, calc(100vw - 48px));
        border-top: 6px solid #ecad0a;
        background: white;
        padding: 40px;
        box-shadow: 0 18px 50px rgba(3, 33, 71, 0.08);
      }

      p {
        color: #888888;
        line-height: 1.6;
      }

      strong {
        color: #209dd7;
      }
    </style>
  </head>
  <body>
    <main>
      <p><strong>Project Management MVP</strong></p>
      <h1>Hello world from FastAPI</h1>
      <p>This static page is served by the backend container.</p>
      <p id="api-status">Checking API health...</p>
    </main>
    <script>
      fetch("/api/health")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("api-status").textContent = `API status: ${data.status}`;
        })
        .catch(() => {
          document.getElementById("api-status").textContent = "API status: unavailable";
        });
    </script>
  </body>
</html>
